[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

markers =
    smoke: fast deploy gate — core journeys only
    critical: PR merge gate — primary flows
    regression: full nightly regression suite
    env_validation: environment accessibility gate
    login: login and authentication module tests
    shopping: shopping and cart module tests
    api: API test module

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [ %(levelname)-5s ] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
